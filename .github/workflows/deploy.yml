name: Deploy to Amazon EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pindah ke direktori repository di server EC2.
            # Asumsinya Anda meng-clone project ke direktori 'erp' di home direktori user.
            cd ~/erp || exit
            
            # Update code dari branch main
            git pull origin main
            
            # Pastikan database dan redis berjalan
            docker compose up -d
            
            # Masuk ke folder API
            cd apps/api
            
            # Install dependencies
            npm install
            
            # Build project
            npm run build
            
            # Menjalankan / merestart API dengan PM2
            pm2 restart erp-api || pm2 start dist/main.js --name "erp-api"
            pm2 save
